name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name tun_tray `
            --version-file version_info.txt `
            --hidden-import PIL._tkinter_finder `
            --collect-all pystray `
            --collect-all PIL `
            tun_tray.py

      - name: Verify build
        run: |
          if (Test-Path dist\tun_tray.exe) {
            $size = (Get-Item dist\tun_tray.exe).Length / 1MB
            Write-Host "Built tun_tray.exe ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "tun_tray.exe was not produced"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun_tray-windows
          path: dist/tun_tray.exe
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tun_tray.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
